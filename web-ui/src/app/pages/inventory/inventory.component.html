<mat-card>
  <mat-card-header>
    <mat-card-title>Inventory Health</mat-card-title>
    <mat-card-subtitle>Quick stock visibility prototype</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="stock-list">
      @for (item of stockHealth; track item.item) {
        <div>
          <div class="row-title">
            <span>{{ item.item }}</span>
            <span>{{ item.level }}%</span>
          </div>
          <mat-progress-bar mode="determinate" [value]="item.level"></mat-progress-bar>
        </div>
      }
    </div>
  </mat-card-content>
</mat-card>
