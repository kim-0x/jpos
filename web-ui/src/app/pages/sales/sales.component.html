<mat-card>
  <mat-card-header>
    <mat-card-title>POS Terminal</mat-card-title>
    <mat-card-subtitle>Prototype cashier workflow</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="scan-row">
      <mat-form-field appearance="outline">
        <mat-label>Barcode</mat-label>
        <input matInput placeholder="Scan product" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Qty</mat-label>
        <input matInput type="number" value="1" min="1" />
      </mat-form-field>

      <button mat-flat-button color="primary">Add item</button>
    </div>

    <mat-divider></mat-divider>

    <h3>Recent Transactions</h3>
    <mat-list>
      @for (sale of recentSales; track sale.id) {
        <mat-list-item>
          <span matListItemTitle>{{ sale.id }}</span>
          <span matListItemLine>Total {{ sale.total | currency }}</span>
        </mat-list-item>
      }
    </mat-list>
  </mat-card-content>
</mat-card>
