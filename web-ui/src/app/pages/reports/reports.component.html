<mat-card>
  <mat-card-header>
    <mat-card-title>Reports</mat-card-title>
    <mat-card-subtitle>Generated {{ generatedAt | date: 'medium' }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <mat-list>
      @for (item of reportItems; track item) {
        <mat-list-item>{{ item }}</mat-list-item>
      }
    </mat-list>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-stroked-button>Export JSON</button>
    <button mat-flat-button color="primary">View report</button>
  </mat-card-actions>
</mat-card>
