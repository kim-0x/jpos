server.port=8080

bluejay.datasource.url=${BLUEJAY_DB_URL:jdbc:sqlite:data/db/bluejay.db}
bluejay.datasource.driver-class-name=${BLUEJAY_DB_DRIVER:org.sqlite.JDBC}

bluejay.security.jwt.secret=${BLUEJAY_JWT_SECRET}
bluejay.security.jwt.expiration-seconds=${BLUEJAY_JWT_EXPIRATION_SECONDS:3600}

bluejay.bootstrap.admin.username=${BLUEJAY_BOOTSTRAP_ADMIN_USERNAME:}
bluejay.bootstrap.admin.secret=${BLUEJAY_BOOTSTRAP_ADMIN_SECRET:}

